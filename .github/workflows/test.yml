name: Test

# Every push and pull request: the unit tests, and on the oldest supported releases
# (Debian 12, Ubuntu 24.04) the host test — a host set up and hardened in a container the
# way a workstation does it (test/host.sh) — and the workstation test — a Debian or Ubuntu
# machine made the first workstation (test/workstation.sh). The newer releases, new ones
# included, run weekly (distros.yml).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: test -z "$(gofmt -l cmd pkg main.go)"
      - run: go vet ./...
      - run: go test ./...

  containers:
    name: ${{ matrix.test }} ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: [host, workstation]
        image: ["debian:12", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: test/${{ matrix.test }}.sh "${{ matrix.image }}"
