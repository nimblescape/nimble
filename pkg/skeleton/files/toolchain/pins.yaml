# Pinned versions of the programming languages, the same on every machine — change them
# with nimble tool use <language>. Bugfix updates come as a daily pull request (nimble tool
# pins shows them).
# Every other tool (nvm, npm, uv, gh, …) stays current: nimble update updates it.

node: 26.8.1
go: 1.27.2
rust: 1.100.0 # rustup default toolchain (tool: rust)
python: 3.12.15 # default python / python3, and uv's global pin

# Global npm packages (tool: node). name@version pins one; without a version it
# follows the latest release.
npmGlobal:
  - npm

# go install targets (tool: go), @latest unless a version is given.
goTools:
  - golang.org/x/tools/gopls
  - github.com/go-delve/delve/cmd/dlv
  - honnef.co/go/tools/cmd/staticcheck

# Python command-line tools (tool: python), installed with `uv tool install`.
uvTools: []
